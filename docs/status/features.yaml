schema_version: 1
verified_against: 18301f0
verified_on: 2026-08-10

statuses:
  implemented: Source and focused test evidence exist; production operation is not implied.
  partial: Material implementation exists, but the promised journey is incomplete.
  accepted_not_implemented: Accepted by ADR, but repository convergence is incomplete.
  implemented_unverified: Material source exists but operational verification or a required adjacent flow remains.
  demo_only: Behavior relies on demo or mock adapters.
  retired: Explicitly removed or superseded.

