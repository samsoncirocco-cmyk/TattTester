  ensemble_generation_quality:
    status: implemented_unverified
    evidence:
      - src/services/intake/internal/characterIdentity.ts
      - src/services/council/internal/structuredMode.ts
      - src/services/council/__tests__/ensemblePromptContract.test.ts
      - src/services/designSession/__tests__/designSessionService.test.ts
      - src/services/generation/internal/routing.ts
      - src/services/generation/__tests__/routing.test.ts
    limitations:
      - Single- and multi-character briefs preserve verified character-to-series bindings in the final generation prompt, including crossovers, while ambiguous bare names abstain instead of guessing a franchise.
      - Identity bindings come from customer-grounded structured extraction or unambiguous catalog matches; multi-source requests require per-character catalog corroboration, so out-of-catalog crossover names remain in the roster without a source binding rather than risking a swapped franchise.
      - The exact identity clause crosses the design-session-to-generation boundary unchanged, alongside cast count, interaction, prop ownership, and ensemble-safe compositional cuts.
      - The current generated snapshot contains 1,000 ranked anime titles, but only 505 have main-character rows from the present Kitsu mapping and manga coverage is not yet included.
      - Production image-level character fidelity still depends on the pinned generation model and has not yet been measured against a scored render corpus.

  durable_design_session_images:
    status: implemented_unverified
    evidence:
      - src/services/designSession/internal/durableImage.ts
      - src/services/designSession/__tests__/durability.test.ts
      - src/services/storage/imageStorageService.ts
    limitations:
      - Design-session reveal, critique, and refinement images are copied to product-owned storage before persistence.
      - Production storage requires an existing GCP_STORAGE_BUCKET and service-account credentials supplied as JSON or split environment variables; local credential-file fallback remains supported.
      - Other generation entry points must be audited separately; this feature does not claim every provider URL product-wide is durable.

